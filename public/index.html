<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Shown until the app has loaded, so a slow phone never sees a blank white page. -->
    <style>
      #boot {
        margin: auto;
        padding: 24px;
        max-width: 420px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #60646c;
        font-size: 17px;
        line-height: 1.5;
      }
      #boot .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 16px;
        border: 4px solid #e3effc;
        border-top-color: #1570d1;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot button {
        margin-top: 16px;
        padding: 14px 28px;
        border: 0;
        border-radius: 12px;
        background: #1570d1;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
      }
      #boot .later {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #000;
        }
        #boot {
          color: #b0b4ba;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. The app replaces what is inside when it starts. -->
    <div id="root">
      <div id="boot">
        <div id="boot-loading">
          <div class="spinner"></div>
          <div>Loading…</div>
        </div>
        <div class="later" id="boot-slow">
          <p>This is taking a while. Check your internet connection, then tap Reload.</p>
          <button type="button" onclick="location.reload()">Reload</button>
        </div>
        <div class="later" id="boot-failed">
          <p>The page couldn't open. Tap Reload. If it still doesn't work, open this link in Safari or Chrome.</p>
          <button type="button" onclick="location.reload()">Reload</button>
        </div>
      </div>
    </div>
    <script>
      // Before the app starts: after a while, or if its files fail to load, offer Reload.
      (function () {
        function show(id) {
          var boot = document.getElementById('boot');
          if (!boot) return; // The app has started.
          var slow = document.getElementById('boot-slow');
          var failed = document.getElementById('boot-failed');
          if (slow) slow.style.display = id === 'boot-slow' ? 'block' : 'none';
          if (failed) failed.style.display = id === 'boot-failed' ? 'block' : 'none';
          var loading = document.getElementById('boot-loading');
          if (loading && id === 'boot-failed') loading.style.display = 'none';
        }
        setTimeout(function () {
          show('boot-slow');
        }, 15000);
        window.addEventListener(
          'error',
          function () {
            show('boot-failed');
          },
          true,
        );
      })();
    </script>
  </body>
</html>
